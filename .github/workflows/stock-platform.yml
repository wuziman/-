name: stock-platform

on:
  push:
    paths:
      - 'stock-platform/**'
      - '.github/workflows/stock-platform.yml'
  pull_request:
    paths:
      - 'stock-platform/**'
      - '.github/workflows/stock-platform.yml'

jobs:
  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stock-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: stock-platform/backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check app tests
      - run: python -m pytest
